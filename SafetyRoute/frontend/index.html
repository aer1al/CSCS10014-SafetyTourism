<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptiRoute - AI Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="css/feature.css" />
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  
  <body>
    <header>
        <div class="header-content">
            <div class="logo">
                <h1 style="display: flex; align-items: center; font-size: 40px; margin: 0;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 0;">
                        <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM9.5 14.5L7.5 12.5L8.91 11.09L10.5 12.67L15.09 8.08L16.5 9.5L9.5 14.5Z" fill="white"/>
                        <path d="M12 6.5C10.62 6.5 9.5 7.62 9.5 9C9.5 10.38 10.62 11.5 12 11.5C13.38 11.5 14.5 10.38 14.5 9C14.5 7.62 13.38 6.5 12 6.5Z" fill="#00509d"/>
                    </svg>
                    OptiRoute
                </h1>
            </div>
            <nav>
                <a href="index.html" class="active">Feature</a>
                <a href="home.html">Home</a>
                <a href="team.html">Team</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>
    
    <div class="sidebar" id="sidebar">
      <button class="toggle-btn" id="toggleBtn">◀</button>

      <div class="sidebar-content">
        <div class="search-container">
          <h3>🚩 Tìm Lộ Trình</h3>

          <div class="demo-switch-container">
            <label class="switch">
              <input type="checkbox" id="demoToggle">
              <span class="slider round"></span>
            </label>
            <span class="switch-label">Chế độ Demo (Mưa bão giả lập)</span>
          </div>

          <div class="input-group">
            <label>Điểm bắt đầu</label>
            <div class="autocomplete-wrapper">
              <input type="text" id="startPoint" placeholder="Nhập vị trí..." autocomplete="off" />
              <ul id="start-results" class="results-list"></ul>
            </div>
          </div>

          <div class="input-group">
            <label>Điểm đến</label>
            <div class="autocomplete-wrapper">
              <input type="text" id="endPoint" placeholder="Nhập nơi đến..." autocomplete="off" />
              <ul id="end-results" class="results-list"></ul>
            </div>
          </div>

          <div class="input-group">
            <label>Phương tiện</label>
            <select id="vehicleMode" class="custom-select">
                <option value="motorbike">🛵 Xe máy (Khuyên dùng)</option>
                <option value="car">🚗 Ô tô / Taxi</option>
                <option value="bus">🚌 Xe buýt</option>
                <option value="bicycle">🚲 Xe đạp</option>
                <option value="walking">🚶 Đi bộ</option>
            </select>
          </div>

          <div class="preferences-box">
             <label class="pref-title">Ưu tiên tránh:</label>
             
             <div class="pref-row">
                <span class="pref-label">⛈️ Ngập/Bão</span>
                <input type="range" id="pref-weather" class="styled-slider" min="0" max="2" step="0.5" value="1.5">
             </div>

             <div class="pref-row">
                <span class="pref-label">👥 Đám đông</span>
                <input type="range" id="pref-crowd" class="styled-slider" min="0" max="2" step="0.5" value="1.0">
             </div>
             
          </div>

          <button id="searchBtn" class="btn-primary">
            🔍 Phân tích AI & Tìm đường
          </button>
        </div>

        <div id="status-area"></div>
      </div>
    </div>

    <div id="map"></div>

    <div class="layer-control-bar">
      <label class="modern-toggle weather-toggle">
        <input type="checkbox" id="chk-weather" checked />
        <span class="toggle-content">
          <span class="icon">⛈️</span> <span class="label">Thời tiết</span>
        </span>
      </label>
      <div class="divider"></div>
      <label class="modern-toggle disaster-toggle">
        <input type="checkbox" id="chk-disaster" checked />
        <span class="toggle-content">
          <span class="icon">⚡</span> <span class="label">Thiên tai</span>
        </span>
      </label>
      <div class="divider"></div>
      <label class="modern-toggle crowd-toggle">
        <input type="checkbox" id="chk-crowd" />
        <span class="toggle-content">
          <span class="icon">👥</span> <span class="label">Điểm nóng</span>
        </span>
      </label>
    </div>

    <div class="chat-toggle-btn" id="chat-toggle-btn">
        <div class="chat-icon">🤖</div>
    </div>

    <div class="chat-widget" id="chat-widget">
        <div class="chat-header">
            <div class="header-info">
                <div class="avatar-bot">🤖</div>
                <div class="title-container">
                    <h3>Safety Assistant</h3>
                    <span class="status-badge"><span class="dot"></span> Online</span>
                </div>
            </div>
            <button id="close-chat" class="close-btn">✕</button>
        </div>
        <div class="chat-body" id="chat-messages">
            <div class="message bot">
                <div class="msg-content">Xin chào! 👋 Tôi là trợ lý AI Safety.</div>
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Hỏi về lộ trình..." autocomplete="off">
            <button id="send-btn" type="button">➤</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/map_radar.js"></script>
    <script src="js/search.js"></script>
    <script src="js/find_route.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/chat.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        // 1. Lấy tham số 'type' từ đường link
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');

        // Nếu không có tham số nào thì dừng lại, không làm gì cả
        if (!type) return;

        console.log("🔍 Đang kích hoạt chế độ:", type);

        // 2. Lấy các thẻ Checkbox (Đảm bảo ID của bạn đúng với ID trong file HTML)
        const chkWeather = document.getElementById("chk-weather");
        const chkDisaster = document.getElementById("chk-disaster");
        const chkCrowd = document.getElementById("chk-crowd");

        // 3. Hàm hỗ trợ bật/tắt layer
        function setLayerState(checkbox, shouldTurnOn) {
            if (!checkbox) return; // Nếu không tìm thấy checkbox thì bỏ qua

            // Nếu trạng thái hiện tại khác với trạng thái mong muốn
            if (checkbox.checked !== shouldTurnOn) {
                checkbox.checked = shouldTurnOn;
                
                // QUAN TRỌNG: Giả lập hành động click để code bản đồ nhận diện thay đổi
                checkbox.dispatchEvent(new Event('change')); 
            }
        }

        // 4. Xử lý logic: Cái nào được chọn thì Bật, còn lại Tắt hết
        if (type === 'weather') {
            setLayerState(chkWeather, true);   // Bật
            setLayerState(chkDisaster, false); // Tắt
            setLayerState(chkCrowd, false);    // Tắt
        } 
        else if (type === 'disaster') {
            setLayerState(chkWeather, false);
            setLayerState(chkDisaster, true);  // Bật
            setLayerState(chkCrowd, false);
        } 
        else if (type === 'crowd') {
            setLayerState(chkWeather, false);
            setLayerState(chkDisaster, false);
            setLayerState(chkCrowd, true);     // Bật
        }
    });
    </script>
  </body>

</html>
